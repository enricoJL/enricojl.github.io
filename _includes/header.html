<header class="header">
    <div class="navigation">
        <a href="/" class="logo">{{ site.title }}</a>

        <ul class="menu">
            <li class="menu__entry"><a href="{{ '/journal' | prepend: site.baseurl }}">journal</a></li>
            <li class="menu__entry"><a href="{{ '/publications' | prepend: site.baseurl }}">publications</a></li>
            <li class="menu__entry"><a href="{{ '/en-preparation' | prepend: site.baseurl }}">en préparation</a></li>
            <li class="menu__entry"><a href="{{ '/apropos' | prepend: site.baseurl }}">à propos</a></li>
            <li class="menu__entry"><a href="{{ '/infolettre' | prepend: site.baseurl }}">infolettre</a></li>
        </ul>
    </div>

    <ul class="social-links">
        {% if site.author.facebook %}
            <a href="https://facebook.com/{{ site.author.facebook }}" class="social-links__entry" target="_blank">
                <i class="fa fa-facebook"></i>
            </a>
        {% endif %}

        {% if site.author.instagram %}
            <a href="https://instagram.com/{{ site.author.instagram }}" class="social-links__entry" target="_blank">
                <i class="fa fa-instagram"></i>
            </a>
        {% endif %}

        {% if site.author.linkedin %}
            <a href="https://linkedin.com/in/{{ site.author.linkedin }}" class="social-links__entry" target="_blank">
                <i class="fa fa-linkedin"></i>
            </a>
        {% endif %}
    </ul>
</header>
