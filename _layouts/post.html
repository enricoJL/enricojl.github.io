---
layout: default
---
<h1 class="page-heading">{{ page.title }}</h1>

<div class="page-content">
    {{ content }}
</div>

<div class="post-nav-links">
  {% if page.previous %}
    <a href="{{ page.previous.url }}" class="post-nav prev"><span class="fa fa-angle-left"></span> {{ page.previous.title }}</a>
  {% endif %}
  {% if page.previous and page.next %} | {% endif %}
  {% if page.next %}
    <a href="{{ page.next.url }}" class="post-nav next">{{ page.next.title }} <span class="fa fa-angle-right"></span></a>
  {% endif %}
</div>
